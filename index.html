<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ainia — Scene Index</title>
<meta name="description" content="Reading index for Unibody Infinity and The Red Handbag, the two interlinked novels of Ainia." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="si-styles.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span class="brand-name">Ainia</span>
    </div>
    <span class="header-meta">Scene Index &middot; Chapter 1</span>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      Two novels, one palimpsest.
    </div>
    <h1 class="hero-title">AINIA</h1>
    <p class="hero-subtitle">
      Please read with caution.
    </p>
  </div>
</section>

<section id="index-section">
  <div class="section-header">
    <p class="eyebrow">Chapter 1</p>
    <h2>Scene by Scene</h2>
  </div>
  <div class="section-inner">
    <div class="shared-scene-card" id="sharedSceneCard"></div>

    <div class="legend-key">
      <span class="lk-item"><span class="lk-dot" style="background:var(--color-algae)"></span>Unibody Infinity</span>
      <span class="lk-item"><span class="lk-dot" style="background:var(--color-accent)"></span>The Red Handbag</span>
    </div>

    <div class="column-headers">
      <span class="ch-label"></span>
      <span class="ch-label ch-novel-ui">Unibody Infinity</span>
      <span class="ch-label ch-novel-rh">The Red Handbag</span>
    </div>
    <div id="sceneRows"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Ainia</span>
    </div>
    <p class="footer-meta">unibodyinfinity.substack.com</p>
    <p class="footer-meta">&copy; 2026 Ainia. All rights reserved.</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
